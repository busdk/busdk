version: "0"
env_files:
  - .env
profile_dirs:
  - profiles
default_services:
  - api
groups:
  infrastructure:
    name: Infrastructure
    services:
      - postgres
      - events
      - events-relay
  security:
    name: Security
    services:
      - identities
  integrations:
    name: Integrations
    services:
      - engine
      - claude-engine
      - repos
      - repos-ssh
      - workers
      - tasks
      - threads
  gateways:
    name: API gateways
    services:
      - api
services:
  postgres:
    profile: postgres/native
  events:
    profile: bus/events/postgres
    params:
      capability_token: local
    depends_on:
      - identities
      - postgres
  events-relay:
    profile: bus-events-relay
    params:
      local_environment_id: local
    depends_on:
      - events
  identities:
    profile: bus/identities/local
  repos:
    profile: bus/repos/local
    params:
      events_url: "{env:BUS_EVENTS_URL}"
    depends_on:
      - events
  repos-ssh:
    profile: bus/repos/ssh
    params:
      events_url: "{env:BUS_EVENTS_URL}"
    depends_on:
      - events
      - identities
      - repos
  workers:
    profile: bus/workers/appserver
    params:
      events_url: "{env:BUS_EVENTS_URL}"
    depends_on:
      - events
      - claude-engine
      - repos
      - repos-ssh
  tasks:
    profile: bus/tasks/local
    params:
      events_url: "{env:BUS_EVENTS_URL}"
    depends_on:
      - events
  threads:
    profile: bus/threads/local
    params:
      events_url: "{env:BUS_EVENTS_URL}"
    depends_on:
      - events
  engine:
    profile: bus/engine/local
    params:
      events_url: "{env:BUS_EVENTS_URL}"
    depends_on:
      - events
  claude-engine:
    profile: bus/claude/engine
    params:
      events_url: "{env:BUS_EVENTS_URL}"
    runtime:
      args:
        - --events-url
        - "{param:events_url}"
        - --token-file
        - "{param:token_file}"
        - --provider
        - "{env:BUS_CLAUDE_PROVIDER}"
        - --base-dir
        - "{env:BUS_CLAUDE_BASE_DIR}"
        - --attached-workspace-allow
        - "{env:BUS_CLAUDE_ATTACHED_WORKSPACE_ALLOW}"
        - --attached-workspace-lock-dir
        - "{env:BUS_ATTACHED_WORKSPACE_LOCK_DIR}"
      env:
        - name: BUS_CLAUDE_BASE_DIR
          description: Per-session Claude configuration root required by attached workspaces.
          value_from: env:BUS_CLAUDE_BASE_DIR
          default: "{env:BUS_SERVICES_BUS_DIR}/services/claude-sessions"
        - name: BUS_CLAUDE_ATTACHED_WORKSPACE_ALLOW
          description: Canonical root authorized for attached Claude sessions in this local stack.
          value_from: env:BUS_CLAUDE_ATTACHED_WORKSPACE_ALLOW
          default: "{env:BUS_SERVICES_STACK_DIR}"
        - name: BUS_ATTACHED_WORKSPACE_LOCK_DIR
          description: Shared attached-workspace lock directory used by Claude and Workers.
          value_from: env:BUS_ATTACHED_WORKSPACE_LOCK_DIR
          default: "{env:BUS_SERVICES_BUS_DIR}/services/workers/runtime/attached-workspace-locks"
    depends_on:
      - events
  api:
    profile: bus/api/local
    params:
      capability_token: local
    depends_on:
      - identities
      - events
      - engine
      - workers
      - tasks
      - threads
